[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentenv-framework"
version = "0.9.1303"
description = "SDK and CLI for building, deploying and running agent environments and the tasks that grade agents in them."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Scale AI" }]
requires-python = ">=3.11"
keywords = ["reinforcement-learning", "rl-environments", "ai-agents", "llm-agents", "agent-evaluation", "mcp", "model-context-protocol", "a2a", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "agentenv-framework-protocol>=0.1.0",
    "certifi>=2024.2.2",  # the public roots the local transfer CA's trust bundle carries
    "click>=8.0.0",
    "cryptography>=42",  # the local transfer CA
    "httpx>=0.27.0",
    "litellm>=1.96.0,<1.97",
    "mcp>=1.0.0,<2",  # 2.0.0 removed mcp.server.fastmcp, imported at module scope by env/gateway
    "packaging>=22",  # evaluates a plugin's requirement markers with no extra
    "a2a-sdk==0.3.26",
    "pydantic>=2.12",  # model_validate(extra=...) reads agent responses tolerantly
    "pymongo>=4.7",
    "python-multipart>=0.0.13",  # the local grant server's upload forms
    "pyyaml>=6.0",
    "starlette>=0.40",  # the local grant server
    "uvicorn>=0.47",  # 0.47 adds ssl_context_factory, how the local grant server gets its TLS context
    "modal>=1.5.2.dev22",  # dev22 adds _experimental_create(tags=); dev2 added VM-mode V2 (vm_runtime)
    "e2b~=2.46.4",  # AsyncSandbox/AsyncTemplate APIs validated against the 2.46 line
]

[project.optional-dependencies]
# The AWS store backends (S3, Secrets Manager, DynamoDB, ECR), selected by impl pointer in config.toml.
aws = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
]
# The local explorer / `agent-env up` (Part 5). Optional so a library or worker install
# stays lean; `agent-env up` fails fast with an install hint when it is absent.
explorer = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# The Google Cloud store backends, selected by impl pointer in config.toml.
gcp = [
    "google-api-core>=2.24",
    "google-auth>=2.40",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=3.0",
    "requests>=2.31",
]
# The sail_vm sandbox provider (Sail Research Sailboxes), selected with --sandbox sail_vm.
sail = [
    "sail~=0.12.8",  # Sailbox exec/fs/listener/egress APIs validated against the 0.12 line
]
dev = [
    "agentenv-framework[aws,explorer,gcp,sail]",  # so the AWS, explorer, GCP backend and Sail provider tests run in CI
    "griffelib==2.3.0",  # the plugin API check; exact, since what it reports as a break changes between releases
    "moto>=5.0.0",
    "psycopg2-binary>=2.9.0",  # the gateway server module's driver; outside its container only the tests import it
    "pytest>=9.0",
    "pytest-asyncio>=0.23.0",
    "pytest-dependency>=0.6.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.0.0",
]

[project.scripts]
agent-env = "agent_env.cli:cli"

[project.entry-points."agent_env.bundles"]
hello = "agent_env.examples"

[project.urls]
Homepage = "https://www.agentenvframework.com"
Documentation = "https://www.agentenvframework.com/docs"
Repository = "https://github.com/scaleapi/agentenv-framework"
Issues = "https://github.com/scaleapi/agentenv-framework/issues"
Changelog = "https://github.com/scaleapi/agentenv-framework/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_env"]
# The explorer UI *source* lives at src/agent_env/explorer/ui/ (a Next.js project).
# Keep it out of the wheel — only its built output ships, copied to explorer/static/
# by the UI build step. node_modules/out/.next are already .gitignore-excluded.
exclude = ["src/agent_env/explorer/ui"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tst", "packages/agentenv-protocol", ".github/scripts"]

[tool.uv.workspace]
members = ["packages/agentenv-protocol"]

[tool.uv.sources]
agentenv-framework-protocol = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:Pydantic serializer warnings:UserWarning",
]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "installer: runs the real pip, uv and pipx offline against locally built wheels (tst/installer; `make installer-test`)",
    "int_test_slow: marks integration tests that take minutes per test (real Docker build / sandbox VM / Modal / gateway / agent). Excluded from the fast tier; opt in via `make int-test-slow`.",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
