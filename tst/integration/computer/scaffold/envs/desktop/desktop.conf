[program:reference-driver]
command=/opt/driver/bin/python /opt/desktop/driver.py
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/agentenv/reference-driver.log

[program:fixture-desk]
command=/usr/local/bin/start-desktop with-x python3 /opt/desktop/fixture.py /home/user/fixture
priority=30
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/agentenv/fixture-desk.log
