name: verl contract

# AgentEnvAgentLoop on verl itself (tst/verl): verl's ToolAgentLoop plays a row the writer wrote, with Qwen3's
# tokenizer and a stand-in rollout server, on verl 0.9.1 and on its main branch. verl, torch and their dependencies
# are installed over the dev environment; torch is the CPU build, as nothing generates. It runs on pull requests that
# touch the helper, the OpenEnv server it plays or the tier, weekly, and on demand; it isn't a required check.

on:
  pull_request:
    paths:
      - "src/agent_env/training/**"
      - "src/agent_env/openenv/**"
      - "tst/verl/**"
      - "tst/unit/training/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/verl.yml"
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verl-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  loop:
    name: agent loop (verl ${{ matrix.verl }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - verl: "0.9.1"
            requirement: "verl==0.9.1"
          - verl: "main"
            requirement: "verl @ git+https://github.com/volcengine/verl@main"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install from uv.lock with the verl extra
        run: |
          python -m pip install --quiet -r .github/ci-requirements.txt
          uv sync --locked --extra dev --extra verl --python "$(command -v python)"
      - name: Install verl and CPU torch
        run: |
          uv pip install --python .venv/bin/python "${{ matrix.requirement }}" torch \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          .venv/bin/python -c "from importlib.metadata import version; print('verl', version('verl'), 'torch', version('torch'))"
      - name: verl tier
        run: .venv/bin/python -m pytest tst/verl -rA --timeout=900 --junitxml=junit-verl.xml
      - name: No skips
        if: always()
        run: .venv/bin/python .github/scripts/check_skip_policy.py junit-verl.xml
