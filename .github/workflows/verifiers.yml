name: verifiers contract

# Rollouts through verifiers' NeMo Gym taskset, the one prime-rl trains through, against the resources server
# agent_env.training.nemo_gym serves for a bundle (tst/verifiers), on verifiers 0.4.0 and on its main branch, which
# prime-rl follows. verifiers pins mcp 2 and the framework mcp 1, so verifiers gets a venv of its own and only vf-eval
# goes on PATH. It runs on pull requests that touch the helper, the OpenEnv server it plays or the tier, weekly, and on
# demand; it isn't a required check.

on:
  pull_request:
    paths:
      - "src/agent_env/training/**"
      - "src/agent_env/openenv/**"
      - "tst/verifiers/**"
      - "tst/nemo_gym/**"
      - "tst/unit/training/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/verifiers.yml"
  schedule:
    - cron: "53 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifiers-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  taskset:
    name: taskset (verifiers ${{ matrix.verifiers }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - verifiers: "0.4.0"
            requirement: "verifiers==0.4.0"
          - verifiers: "main"
            requirement: "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers@main"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install from uv.lock with the nemo-gym extra
        run: |
          python -m pip install --quiet -r .github/ci-requirements.txt
          uv sync --locked --extra dev --extra nemo-gym --python "$(command -v python)"
      - name: Install verifiers in its own venv, with vf-eval on PATH
        run: |
          uv venv "$RUNNER_TEMP/verifiers" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/verifiers/bin/python" "${{ matrix.requirement }}"
          mkdir -p "$RUNNER_TEMP/vf-bin"
          ln -s "$RUNNER_TEMP/verifiers/bin/vf-eval" "$RUNNER_TEMP/vf-bin/vf-eval"
          echo "$RUNNER_TEMP/vf-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/verifiers/bin/python" -c "from importlib.metadata import version; print('verifiers', version('verifiers'))"
      - name: verifiers tier
        run: .venv/bin/python -m pytest tst/verifiers -rA --timeout=900 --junitxml=junit-verifiers.xml
      - name: No skips
        if: always()
        run: .venv/bin/python .github/scripts/check_skip_policy.py junit-verifiers.xml
