name: Clean install

# Both distributions built as the release builds them, installed into a fresh venv from public PyPI with
# nothing else, and the hello bundle run twice by name and checked through the local store: no secrets, no
# token and no plugin, on every pull request. The script gives each step an allowlisted environment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
      - name: Build, install clean, run hello twice
        run: python .github/scripts/clean_install.py --work "$RUNNER_TEMP/clean-install"
