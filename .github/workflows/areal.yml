name: AReaL contract

# AgentEnvWorkflow in AReaL's agent workflow (tst/areal): AReaL's rollout engine resolves it from its import path into
# its proxy workflow in inline mode, grouped, and plays the unit tier's bundle through a stand-in model, on AReaL 2.1.0
# and on its main branch. AReaL and torch are installed over the dev environment; torch is the CPU build, as nothing
# generates. It runs on pull requests that touch the helper or the tier, weekly, and on demand; it isn't a required
# check.

on:
  pull_request:
    paths:
      - "src/agent_env/training/**"
      - "tst/areal/**"
      - "tst/unit/training/**"
      - "tst/util/fake_vllm.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/areal.yml"
  schedule:
    - cron: "53 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: areal-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  workflow:
    name: agent workflow (AReaL ${{ matrix.areal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        areal: ["v2.1.0", "main"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install from uv.lock
        run: |
          python -m pip install --quiet -r .github/ci-requirements.txt
          uv sync --locked --extra dev --python "$(command -v python)"
      - name: Install AReaL and CPU torch
        run: |
          uv pip install --python .venv/bin/python "areal @ git+https://github.com/areal-project/AReaL@${{ matrix.areal }}" torch \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          .venv/bin/python -c "from importlib.metadata import version; print('areal', version('areal'), 'torch', version('torch'))"
      - name: AReaL tier
        run: .venv/bin/python -m pytest tst/areal -rA --timeout=900 --junitxml=junit-areal.xml
      - name: No skips
        if: always()
        run: .venv/bin/python .github/scripts/check_skip_policy.py junit-areal.xml
