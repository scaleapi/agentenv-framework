name: Publish to PyPI

# On a release tag, uploads agentenv-framework-protocol and then agentenv-framework to PyPI through trusted
# publishing, so no token is stored anywhere, once main's CI has passed on the tagged commit. Each job builds its
# distribution the way the release does (agentenv-framework pinned to the exact agentenv-framework-protocol it was
# released with) and runs in its own environment, because PyPI binds a pending publisher to one workflow and
# environment per project. Once both are on PyPI, it creates the tag's GitHub release, whose notes list the pull
# requests merged since the previous release. Files already on PyPI and a release that already exists are skipped, so a
# rerun is safe.
#
# It also publishes the infra images agent-env ships (agent_env.env.published_images) whose tags the registry lacks,
# and records their digests in the wheel, once the repository variable PUBLISH_INFRA_IMAGES is "true". Run by hand on
# main, it publishes them alone, with nothing sent to PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release automation tags a version bump seconds after it pushes the bump, so this waits for those runs
  # rather than failing on one still in progress. After a failed run passes on a re-run, re-run this workflow.
  main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for main's CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in local-backends.yml clean-install.yml plugin-api.yml; do
            echo "Waiting for ${workflow} on main at ${GITHUB_SHA}"
            until run=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --event push --limit 1 \
                --json status,conclusion,url --jq '.[] | select(.status == "completed") | "\(.conclusion) \(.url)"') &&
                [ -n "$run" ]; do
              sleep 30
            done
            read -r conclusion url <<< "$run"
            [ "$conclusion" = success ] || { echo "::error::${workflow} ended ${conclusion} on ${GITHUB_SHA}: ${url}"; exit 1; }
            echo "${workflow} passed: ${url}"
          done

  # The infra images whose tags the registry lacks, each tagged by its sources at this commit.
  infra-plan:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_INFRA_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
      - name: Find the images the registry lacks
        id: plan
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked --no-dev
          echo "missing=$(uv run --no-sync python .github/scripts/infra_images.py plan --missing)" >> "$GITHUB_OUTPUT"

  # Builds each missing image on a runner of each platform, checks that it runs, and pushes it under its tag and
  # platform (src-<digest>-amd64), which nothing looks up: infra-publish tags the multi-platform image once main's CI
  # has passed.
  infra-build:
    needs: infra-plan
    if: needs.infra-plan.outputs.missing != '[]'
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.infra-plan.outputs.missing) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      NAME: ${{ matrix.image.name }}
      DOCKERFILE: ${{ matrix.image.dockerfile }}
      CONTEXT: ${{ matrix.image.context }}
      TAG: ${{ matrix.image.tag }}
      BUILT: ${{ matrix.image.repository }}:${{ matrix.image.tag }}-${{ matrix.arch }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
      - name: Build
        run: |
          # No provenance attestation, which would show in the multi-platform image as an unknown platform.
          docker build --platform "$PLATFORM" --provenance=false -f "$DOCKERFILE" -t "$BUILT" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "io.agentenv.source-tag=${TAG}" "$CONTEXT"
      - name: Check that it runs
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python .github/scripts/infra_images.py smoke "$NAME" "$BUILT"
      - name: Push it under its tag and platform
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$BUILT"

  infra-publish:
    needs: [main-ci, infra-plan, infra-build]
    if: needs.infra-plan.outputs.missing != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag each image's platform builds as one multi-platform image under its source tag
        env:
          GHCR_TOKEN: ${{ github.token }}
          MISSING: ${{ needs.infra-plan.outputs.missing }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          jq -r '.[] | "\(.repository):\(.tag)"' <<< "$MISSING" | while read -r ref; do
            docker buildx imagetools create -t "$ref" \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              "${ref}-amd64" "${ref}-arm64"
          done

  protocol:
    needs: main-ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-protocol
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
      - name: Check the tag names the version being built
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME}, but pyproject.toml is at ${version}"; exit 1; }
      - name: Build agentenv-framework-protocol
        run: uv build --no-sources packages/agentenv-protocol --out-dir dist
      - name: Check its metadata renders
        run: uvx --index-url https://pypi.org/simple twine check --strict dist/*
      - name: Publish agentenv-framework-protocol
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  # Waits for the infra images when they're published: a release's wheel names only images the registry holds.
  framework:
    needs: [protocol, infra-plan, infra-build, infra-publish]
    if: >-
      !cancelled() && needs.protocol.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.infra-plan.result)
      && contains(fromJSON('["success", "skipped"]'), needs.infra-build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.infra-publish.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
      # Before the pin below edits pyproject.toml, which the locked sync checks.
      - name: Record the published infra images' digests in the wheel
        if: needs.infra-plan.result == 'success'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python .github/scripts/infra_images.py write src/agent_env/env/published_images.json
      - name: Build agentenv-framework, pinned to this release's agentenv-framework-protocol
        run: |
          protocol=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agentenv-protocol/pyproject.toml)
          # Only the quoted requirement: the directory name also appears in the sdist include list and the uv
          # workspace members, and the bare name keys [tool.uv.sources]; none of those may be rewritten.
          sed -i "s/\"agentenv-framework-protocol[^\"]*\"/\"agentenv-framework-protocol==${protocol}\"/" pyproject.toml
          grep -q "\"agentenv-framework-protocol==${protocol}\"" pyproject.toml
          # The echo-mcp example's server image installs the protocol this release ships with.
          echo_requirements=src/agent_env/examples/echo-mcp/envs/echo/requirements.txt
          sed -i "s/^agentenv-framework-protocol.*/agentenv-framework-protocol==${protocol}/" "$echo_requirements"
          grep -qx "agentenv-framework-protocol==${protocol}" "$echo_requirements"
          uv build --no-sources --out-dir dist
      - name: Check its metadata renders
        run: uvx --index-url https://pypi.org/simple twine check --strict dist/*
      - name: Publish agentenv-framework
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  release:
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub release, with notes from the pull requests since the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi
          framework="${tag#v}"
          protocol=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agentenv-protocol/pyproject.toml)
          header="On PyPI: [agentenv-framework ${framework}](https://pypi.org/project/agentenv-framework/${framework}/) · [agentenv-framework-protocol ${protocol}](https://pypi.org/project/agentenv-framework-protocol/${protocol}/)"
          args=(--verify-tag --title "$tag" --generate-notes --notes "$header")
          # From the newest earlier tag with a release, not the previous tag: a tag main's CI kept off PyPI has no
          # release, and its pull requests belong in these notes.
          released=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[].tag_name')
          previous=$(git tag --list 'v*' --sort=-v:refname | awk -v tag="$tag" 'after; $0 == tag {after = 1}' |
            grep -m1 -Fx -f <(printf '%s\n' "$released") || true)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" "${args[@]}"
