name: Publish to PyPI

# On a release tag, uploads agentenv-framework-protocol and then agentenv-framework to PyPI through trusted
# publishing, so no token is stored anywhere. Each job builds its distribution the way the release does
# (agentenv-framework pinned to the exact agentenv-framework-protocol it was released with) and runs in its own
# environment, because PyPI binds a pending publisher to one workflow and environment per project. Once both are on
# PyPI, it creates the tag's GitHub release, whose notes list the pull requests merged since the previous tag. Files
# already on PyPI and a release that already exists are skipped, so a rerun is safe.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  explorer-ui:
    # The explorer's built web UI ships inside the agentenv-framework wheel. It is built here, in a job that can't
    # mint a PyPI token and uses no cache, so no npm package runs where it could publish; `framework` takes only
    # the output.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/agent_env/explorer/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Build the static export
        run: npm run build:static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explorer-ui
          path: src/agent_env/explorer/ui/out
          if-no-files-found: error
          retention-days: 1

  protocol:
    # Nothing publishes unless the whole release, UI included, has built.
    needs: explorer-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-protocol
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple uv
      - name: Check the tag names the version being built
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME}, but pyproject.toml is at ${version}"; exit 1; }
      - name: Build agentenv-framework-protocol
        run: uv build --no-sources packages/agentenv-protocol --out-dir dist
      - name: Check its metadata renders
        run: uvx --index-url https://pypi.org/simple twine check --strict dist/*
      - name: Publish agentenv-framework-protocol
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  framework:
    needs: [protocol, explorer-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv from public PyPI
        run: python -m pip install --quiet --index-url https://pypi.org/simple uv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: explorer-ui
          path: src/agent_env/explorer/static
      - name: Build agentenv-framework, pinned to this release's agentenv-framework-protocol
        run: |
          protocol=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agentenv-protocol/pyproject.toml)
          # Only the quoted requirement: the directory name also appears in the sdist include list and the uv
          # workspace members, and the bare name keys [tool.uv.sources]; none of those may be rewritten.
          sed -i "s/\"agentenv-framework-protocol[^\"]*\"/\"agentenv-framework-protocol==${protocol}\"/" pyproject.toml
          grep -q "\"agentenv-framework-protocol==${protocol}\"" pyproject.toml
          uv build --no-sources --out-dir dist
      - name: Check the wheel carries the explorer UI
        run: python .github/scripts/check_explorer_ui.py dist/*.whl
      - name: Check its metadata renders
        run: uvx --index-url https://pypi.org/simple twine check --strict dist/*
      - name: Publish agentenv-framework
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  release:
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub release, with notes from the pull requests since the previous tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi
          framework="${tag#v}"
          protocol=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agentenv-protocol/pyproject.toml)
          header="On PyPI: [agentenv-framework ${framework}](https://pypi.org/project/agentenv-framework/${framework}/) · [agentenv-framework-protocol ${protocol}](https://pypi.org/project/agentenv-framework-protocol/${protocol}/)"
          args=(--verify-tag --title "$tag" --generate-notes --notes "$header")
          # Without a start tag, GitHub counts from the previous release rather than the previous tag.
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -A1 -x "$tag" | sed -n 2p)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" "${args[@]}"
