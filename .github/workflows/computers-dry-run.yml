# Temporary, for the pull request that adds it, removed before it merges: the release's computer-build steps as publish-pypi.yml
# has them, on GitHub's runners, then computer-publish's join and the record's check with a local registry on
# 5001 standing in for ghcr, then an install of a wheel carrying that record composing chromium by pulling it.
name: Computers dry run
'on':
  pull_request:
    paths:
    - .github/workflows/computers-dry-run.yml
permissions:
  contents: read
jobs:
  computer-build:
    strategy:
      fail-fast: true
      matrix:
        arch:
        - amd64
        - arm64
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      AGENT_ENV_DOCUMENT_STORE: local
      AGENT_ENV_OBJECT_STORE: local
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install uv from public PyPI
      run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
    - name: Pin agentenv-framework-protocol in the framework and the shipped bundles, as the release does
      run: 'python3 .github/scripts/shipped_bundles.py pin-pyproject

        python3 .github/scripts/shipped_bundles.py pin

        '
    - name: Install agentenv-framework, built as the release builds it, with the protocol it published
      run: "uv build --no-sources --wheel --out-dir dist\nprotocol=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' packages/agentenv-protocol/pyproject.toml)\npython -m venv \"$RUNNER_TEMP/venv\"\npython3 .github/scripts/infra_build.py\
        \ retry \"$RUNNER_TEMP/venv/bin/python\" -m pip install --quiet \\\n  --index-url https://pypi.org/simple dist/agentenv_framework-*.whl \\\n  \"agentenv-framework-protocol[app]==${protocol}\"\n"
    - name: Start the local registry, its storage in a folder handed on
      run: "mkdir -p \"$RUNNER_TEMP/computers/registry\" \"$RUNNER_TEMP/computers/composed\"\ndocker run --detach --name registry --publish 5000:5000 \\\n  --volume \"$RUNNER_TEMP/computers/registry:/var/lib/registry\"\
        \ mirror.gcr.io/library/registry:2\ntimeout 30 sh -c 'until curl -sf http://localhost:5000/v2/ >/dev/null; do sleep 1; done'\n"
    - name: Compose and probe
      env:
        XDG_STATE_HOME: ${{ runner.temp }}/state
      run: "# shellcheck disable=SC2016 # each try's sh expands them\npython3 .github/scripts/infra_build.py retry sh -c 'rm -rf \"$XDG_STATE_HOME\" &&\n  \"$RUNNER_TEMP/venv/bin/python\" .github/scripts/release_computers.py\
        \ compose \"$ARCH\" \\\n  \"$RUNNER_TEMP/computers/composed\"'\n"
    - name: Stop the local registry
      run: docker stop registry
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: computer-${{ matrix.arch }}
        path: ${{ runner.temp }}/computers
        if-no-files-found: error
        retention-days: 1
  computer-publish:
    needs: computer-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AGENT_ENV_DOCUMENT_STORE: local
      AGENT_ENV_OBJECT_STORE: local
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: computer-*
        path: ${{ runner.temp }}/computers
        merge-multiple: true
    - name: Serve both registries' storage as one local registry, and an empty one on 5001 standing in for ghcr
      run: "docker run --detach --name registry --publish 5000:5000 \\\n  --volume \"$RUNNER_TEMP/computers/registry:/var/lib/registry\" mirror.gcr.io/library/registry:2\ndocker run --detach --name released\
        \ --publish 5001:5000 mirror.gcr.io/library/registry:2\ntimeout 30 sh -c 'until curl -sf http://localhost:5000/v2/ >/dev/null && curl -sf http://localhost:5001/v2/ >/dev/null; do sleep 1; done'"
    - name: Write the stand-in for infra_build.py with ghcr replaced
      run: "cat > \"$RUNNER_TEMP/stand_in.py\" <<'PY'\nimport importlib.util, json, os, re, sys\nspec = importlib.util.spec_from_file_location(\"infra_build\", \".github/scripts/infra_build.py\")\nib =\
        \ importlib.util.module_from_spec(spec); spec.loader.exec_module(ib)\nib.REGISTRY = \"localhost:5001/scaleapi\"\nib._sign_in = lambda: None\nif sys.argv[1] == \"verify-record\":\n    ib.IMAGES =\
        \ {}\nsys.argv = [\"infra_build.py\", *sys.argv[1:]]\nsys.exit(ib.main())\nPY"
    - name: Join each app's images as one index, as computer-publish does, and verify the record
      run: 'python3 "$RUNNER_TEMP/stand_in.py" publish-computers "$RUNNER_TEMP/computers/composed"

        python3 -c "import json, os; t = os.environ[''RUNNER_TEMP'']; c = json.load(open(f''{t}/computers/composed/computers.json'')); json.dump({''images'': [], ''computers'': c}, open(f''{t}/record.json'',
        ''w''))"

        python3 "$RUNNER_TEMP/stand_in.py" verify-record "$RUNNER_TEMP/record.json"'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install uv from public PyPI
      run: python -m pip install --quiet --index-url https://pypi.org/simple -r .github/ci-requirements.txt
    - name: An install of a wheel carrying that record
      run: "python3 .github/scripts/shipped_bundles.py pin-pyproject\npython3 .github/scripts/shipped_bundles.py pin\ncp \"$RUNNER_TEMP/record.json\" src/agent_env/env/published_images.json\nuv build --no-sources\
        \ --wheel --out-dir dist\nprotocol=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' packages/agentenv-protocol/pyproject.toml)\npython -m venv \"$RUNNER_TEMP/user\"\npython3 .github/scripts/infra_build.py\
        \ retry \"$RUNNER_TEMP/user/bin/python\" -m pip install --quiet \\\n  --index-url https://pypi.org/simple dist/agentenv_framework-*.whl \\\n  \"agentenv-framework-protocol[app]==${protocol}\""
    - name: It composes chromium by pulling the released image, in fresh stores and an empty registry
      env:
        XDG_STATE_HOME: ${{ runner.temp }}/userstate
      run: "set -o pipefail\ndocker rm -f registry\ndocker run --detach --name user --publish 5000:5000 mirror.gcr.io/library/registry:2\ntimeout 30 sh -c 'until curl -sf http://localhost:5000/v2/ >/dev/null;\
        \ do sleep 1; done'\nmkdir -p \"$RUNNER_TEMP/bundle/tasks\"\necho '[{\"id\": \"env\", \"type\": \"deploy_env\", \"env_id\": \"chromium\"}]' > \"$RUNNER_TEMP/bundle/tasks/chromium.json\"\ncd \"$RUNNER_TEMP/bundle\"\
        \ && \"$RUNNER_TEMP/user/bin/agent-env\" run . 2>&1 | tee \"$RUNNER_TEMP/run.log\"\nif grep -E 'resolving packages|building the image' \"$RUNNER_TEMP/run.log\"; then\n  echo '::error::the install\
        \ resolved or built chromium, rather than pulling it'; exit 1\nfi\n\"$RUNNER_TEMP/user/bin/python\" -c \"\nfrom agent_env.env import Env\nfrom agent_env.store.routing import namespace_routing\n\
        with namespace_routing():\n    pairs = Env.get('@local/agentenv-framework/browsers/chromium').metadata['composed']['container']\nprint({arch: (r['status'], r.get('published'), r['image']) for arch,\
        \ r in pairs.items()})\nassert all(r.get('published') for r in pairs.values()), pairs\n\""
