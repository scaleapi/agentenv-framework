name: Harness contract

# TRL's harness rollouts on a bundle's own agents (agent_env.training.harness, tst/unit/training/harness_test.py)
# through OpenEnv's capture proxy, on the uv.lock pins and on the latest OpenEnv. The harness reads the proxy's internals
# (its session registry, export and training trace), which OpenEnv can change in any minor release. It runs on pull
# requests that touch the harness or its tier, weekly, and on demand; it isn't a required check.

on:
  pull_request:
    paths:
      - "src/agent_env/training/**"
      - "tst/unit/training/**"
      - "tst/util/fake_vllm.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/harness.yml"
  schedule:
    - cron: "53 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  capture:
    name: capture (openenv ${{ matrix.openenv }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        openenv: ["locked", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from uv.lock, with the latest OpenEnv for latest
        run: |
          python -m pip install --quiet -r .github/ci-requirements.txt
          uv sync --locked --extra dev --python "$(command -v python)"
          if [ "${{ matrix.openenv }}" = latest ]; then uv pip install --python .venv/bin/python --upgrade openenv; fi
          .venv/bin/python -c "import importlib.metadata as m; print('openenv', m.version('openenv'))"
      - name: Harness tier
        run: .venv/bin/python -m pytest tst/unit/training/harness_test.py -rA --timeout=600 --junitxml=junit-harness.xml
      - name: No skips
        if: always()
        run: .venv/bin/python .github/scripts/check_skip_policy.py junit-harness.xml
