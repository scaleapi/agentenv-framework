name: OpenEnv compatibility

# The openenv extra has a floor and no cap, and OpenEnv ships a minor release a week, so the OpenEnv tests run against
# the floor, OpenEnv's latest release and its main branch: weekly, after OpenEnv's Wednesday releases, and on changes
# to the code that uses it.

on:
  schedule:
    - cron: "0 14 * * 4"
  workflow_dispatch:
  pull_request:
    paths:
      - src/agent_env/openenv/**
      - tst/unit/openenv/**
      - tst/integration/openenv/**
      - pyproject.toml
      - .github/workflows/openenv-compat.yml

permissions:
  contents: read

concurrency:
  group: openenv-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_ENV_ENVIRONMENT: dev
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  openenv:
    name: openenv ${{ matrix.openenv }}
    strategy:
      fail-fast: false
      matrix:
        openenv: [floor, release, main]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install from uv.lock
        run: |
          python -m pip install --quiet -r .github/ci-requirements.txt
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install OpenEnv (${{ matrix.openenv }})
        run: |
          case "${{ matrix.openenv }}" in
            floor) spec=$(python -c "import tomllib; print(next(d.replace('>=', '==') for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['openenv'] if d.startswith('openenv>=')))") ;;
            release) spec="openenv" ;;
            main) spec="openenv @ git+https://github.com/openenv/OpenEnv@main" ;;
          esac
          uv pip install --python .venv/bin/python --upgrade-package openenv "$spec"
          .venv/bin/python -c "import importlib.metadata as m; print('openenv', m.version('openenv'))"
      # ECR Public's anonymous pulls fail here for hours at a time. This can restart dockerd, so the registry
      # starts afterwards.
      - name: Pull the base images from mirror.gcr.io
        run: python3 .github/scripts/mirror_base_images.py src tst
      - name: Start the local registry
        run: |
          docker run --detach --name registry --publish 5000:5000 mirror.gcr.io/library/registry:2
          timeout 30 sh -c 'until curl -sf http://localhost:5000/v2/ >/dev/null; do sleep 1; done'
      - name: OpenEnv tests
        run: |
          .venv/bin/python -m pytest -rA --timeout=1200 --junitxml=junit-openenv.xml \
            tst/unit/openenv tst/integration/openenv
      - name: Skips must be declared capability gaps
        if: always()
        run: |
          .venv/bin/python .github/scripts/check_skip_policy.py junit-openenv.xml \
            --allow model_endpoint_configured remote_sandbox default_a2a_agent mcp_server_sources
