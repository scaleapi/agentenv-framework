[project]
name = "agentenv-framework-protocol"
version = "0.1.549"
description = "Open data-plane protocol and server SDK for agent environments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Scale AI" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "a2a", "ai-agents", "rl-environments", "json-rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.11",
    "starlette>=0.37",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = [
    "a2a-sdk[http-server]>=0.3.26,<0.4",
    "mcp>=1.25,<2",  # the peer-agents tools' MCP server; 2.0 removed the server API it serves them with
    "python-multipart>=0.0.13",  # the staging extension's upload forms
    "regex>=2023.12.25",
    "uvicorn>=0.30",
]
# A computer app's own server: ComputerAppEnvironment serves its card and computer-app/v1 over mcp's FastMCP, on a Unix
# socket through uvicorn, and a website browser's CDP relay over WebSockets.
app = [
    "brotli>=1.2",  # a website browser's network log: br answer bodies, decoded for network.har
    "mcp>=1.25,<2",
    "uvicorn>=0.30",
    "websockets>=13",
    "zstandard>=0.23",  # and zstd ones
]
# A computer driver: ComputerDriverEnvironment serves its tools over mcp's FastMCP, crops and encodes frames, records
# the display as H.264 with PyAV (computer-recording/v1), and relays WebSockets to its apps on /svc/<app>/.
computer = [
    "av>=17",
    "mcp>=1.25,<2",
    "Pillow>=10.4",
    "uvicorn>=0.30",
    "websockets>=13",
]
# A macOS driver on MacOSDriver: ScreenCaptureKit captures the display and Quartz events send its input, through PyObjC.
macos = [
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=11; sys_platform == 'darwin'",
]
# A Linux driver on X11Driver: mss captures the X display and XTEST sends its input, through python-xlib.
x11 = [
    "mss>=9,<11",
    "python-xlib>=0.33,<0.34",
]
# A Windows driver on WindowsDriver: mss captures the desktop and SendInput, through ctypes, sends its input.
windows = [
    "mss>=9,<11",
]
dev = [
    "a2a-sdk[http-server]>=0.3.26,<0.4",
    "python-multipart>=0.0.13",
    "regex>=2023.12.25",
    "pytest>=9.0",
    "pytest-asyncio>=0.23.0",
    "mcp>=1.25,<2",
    "fastmcp>=3.4,<4",  # the standalone-fastmcp mount path
    "Pillow>=10.4",  # the computer extra's frame crops and encodings
    "av>=17",  # the computer extra's encoder, and the tests' decoder
    "websockets>=13",  # the computer extra's /svc/<app>/ relay
    "brotli>=1.2",  # the app extra's network.har decoding
    "zstandard>=0.23",
]
[project.urls]
Homepage = "https://www.agentenvframework.com"
Documentation = "https://www.agentenvframework.com/docs"
Repository = "https://github.com/scaleapi/agentenv-framework/tree/main/packages/agentenv-protocol"
Issues = "https://github.com/scaleapi/agentenv-framework/issues"
Changelog = "https://github.com/scaleapi/agentenv-framework/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_protocol"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
