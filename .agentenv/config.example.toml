# agent-env standalone profile — the all-local backend stack (no cloud services).
#
# Copy to .agentenv/config.toml (git-ignored — your own machine's config) to run
# agent-env against local backends. Generated state is not kept in the project: the
# local stores live under ~/.local/state/agent-env/ ($XDG_STATE_HOME/agent-env/ when set).

[stores]
document = "local"   # SQLite      ~/.local/state/agent-env/document_store/documents.db
object   = "local"   # filesystem  ~/.local/state/agent-env/object_store/
image    = "local"   # local OCI registry (registry:2 at localhost:5000)
secret   = "local"   # process env vars, or an optional flat YAML file

[sandbox]
default       = "local"   # envs run as containers on the host Docker daemon
agent_default = "local"   # agents too

# Optional Vercel Sandboxes (install the 'vercel' extra):
# [sandbox.providers.vercel.config]
# image = "vercel/sandbox/universal"
# region = "iad1"
# failover_regions = ["cle1", "sfo1"]
# network_id = "secure-compute-network-id"
# token = "secret:vercel_token"       # with team_id and project_id; omit all three for SDK OIDC
# team_id = "your-team"
# project_id = "your-project"

[agents]
default_a2a_agent_id = "a2a-default"   # what a deploy_agent step that names no agent deploys

# [model]
# base_url = "http://localhost:4000"   # a model proxy on this machine; local containers reach it as host.docker.internal
#                                      # on Linux, bind it to the Docker bridge address and use that: http://172.17.0.1:4000
# api_key  = "env:MY_PROXY_KEY"

[runner]
impl = "agent_env.runner.local_runner:LocalRunner"

[runner.config]
workers = 2

[explorer]
# The explorer is an unauthenticated local control plane, so `agent-env up` always binds
# loopback (127.0.0.1) — there is no `host` knob. To reach it from another machine, use an
# SSH tunnel or a loopback-published container port (`-p 127.0.0.1:8234:8234`). A genuinely
# hosted deployment runs its own `uvicorn agent_env.explorer.app:create_app --factory --host …`
# and lists its public hostname(s) under `allowed_hosts` below.
port = 8234        # not 8233 — Temporal's dev-server UI uses 8233
# allowed_hosts = ["explorer.mybox.internal"]   # extra Host values to accept (a hosted/tunnel bind)
# static_dir = "path/to/built/ui"   # serve a built UI at /; omit for API-only (or the packaged UI)

# A plugin's own settings go under its distribution name; agent-env reads none of it.
# [plugins.agentenv-browser]
# timeout = 30
