type = "computer_driver"
module = "driver.py:CuaDriver"
port = 18765

[install.linux]
python = "requirements.txt"
services = [
    { name = "daemon", command = "venv/bin/python driver.py" },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CuaDriver" },
]

[install."linux/omarchy"]
python = "requirements-omarchy.txt"
downloads = [
    { url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.47.4/cua-driver-rs-0.47.4-linux-x86_64-binary.tar.gz", sha256 = "472de19fe6e347b6db009b010d4447ff8ed6d9af8459844c157acfa6770779e8", to = "cua-driver.tar.gz", arch = "amd64" },
]
run = [{ script = "install-hyprland.sh" }]
services = [
    { name = "daemon", command = "venv/bin/python driver.py" },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CuaDriver" },
]

[install.macos]
python = "requirements-macos.txt"
downloads = [
    { url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.47.10/cua-driver-rs-0.47.10-darwin-arm64.tar.gz", sha256 = "40954056eeb011660abe1ff31693676a5cce6d53b2c0e6afbafb30c9b805c141", to = "CuaDriver.tar.gz", arch = "arm64" },
]
run = [{ script = "install-app.sh" }]
grants = [{ app = "/Applications/CuaDriver.app", services = ["accessibility", "post_event", "screen_capture"] }]
services = [
    { name = "daemon", command = "/Applications/CuaDriver.app/Contents/MacOS/cua-driver serve --socket /tmp/agentenv-cua-driver.sock --dangerously-bypass-approvals --no-overlay", direct = true, environment = { DO_NOT_TRACK = "1", CUA_DRIVER_RS_TELEMETRY_ENABLED = "false", CUA_DRIVER_RS_UPDATE_CHECK = "false" } },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CuaDriver" },
]

[install.windows]
python = "requirements-windows.txt"
downloads = [
    { url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.38.0/cua-driver-rs-0.38.0-windows-x86_64.zip", sha256 = "997f20114ad3db227a854e1e5a886234f76405b155f4af70605d4b7ca4a436a1", to = "cua-driver.zip", arch = "amd64" },
]
run = [{ script = "install-windows.ps1" }]
services = [
    { name = "daemon", command = "venv/Scripts/python.exe driver.py" },
    { name = "driver", command = "venv/Scripts/python.exe -m agentenv_protocol.computer.serve driver.py:CuaDriver" },
]

# cua-driver's own defects on macOS, which gate 3 records without failing the build.
[[known_failures.macos]]
check = "P6"
name = "typed text arrives as key events"
reason = "cua-driver 0.47.10 types each character as a key-down and key-up of keycode 0, the A key, carrying the character as Unicode, so the text arrives whole but an app reading key events sees the A key; Return, Tab and the keys computer_key presses are real keys"

[[known_failures.macos]]
check = "P7"
name = "a drag starts and ends where it says, through its waypoints"
reason = "cua-driver 0.38.0 posted a drag's mouse-down after the pointer had moved along its path, on some first probes after a boot 3 to 10 px from the start; 0.47.10 posts a drag's events as 0.38.0 did and passed its first 13 probes, too few to call an intermittent failure fixed"

# cua-driver 0.38.0's own defect on Windows, which gate 3 records without failing the build.
[[known_failures.windows]]
check = "P4"
name = "16 clicks sent at once all land"
reason = "cua-driver 0.38.0 refuses a click (foreground_unavailable) when the clicked window isn't foreground after it, and in a burst on a window that just opened Windows passes the foreground between the window and its frame, so a few of the first burst's clicks are refused"
