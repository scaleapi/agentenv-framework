type = "computer_driver"
module = "driver.py:AgentDesktop"
port = 18765

[install.linux]
python = "requirements.txt"
downloads = [
    { url = "https://github.com/vercel-labs/agent-desktop/releases/download/v1.2.0/agent-desktop-v1.2.0-x86_64-unknown-linux-gnu.tar.gz", sha256 = "591ae7f4a38479dc045df97e27447c0c8b530441730ab6b990e27c813162af44", to = "agent-desktop.tar.gz", arch = "amd64" },
    { url = "https://github.com/vercel-labs/agent-desktop/releases/download/v1.2.0/agent-desktop-v1.2.0-aarch64-unknown-linux-gnu.tar.gz", sha256 = "68e8ebbb4f80e44485d2f1cf972943a38ee43108e2e0ce56bdfa641fd1599f68", to = "agent-desktop.tar.gz", arch = "arm64" },
]
run = [{ script = "install.sh" }]
services = [{ name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:AgentDesktop" }]

[install.macos]
python = "requirements-macos.txt"
downloads = [
    { url = "https://github.com/vercel-labs/agent-desktop/releases/download/v1.2.0/agent-desktop-v1.2.0-aarch64-apple-darwin.tar.gz", sha256 = "219813428bb1ad8decae172faed05c5964a2415170df402e2786ccfa6452ba82", to = "agent-desktop.tar.gz", arch = "arm64" },
]
run = [{ script = "install.sh", scope = "session" }]
grants = [{ executable = "venv/bin/python", services = ["accessibility", "post_event", "screen_capture"] }]
services = [{ name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:AgentDesktop" }]

[install.windows]
python = "requirements-windows.txt"
downloads = [
    { url = "https://github.com/vercel-labs/agent-desktop/releases/download/v1.2.0/agent-desktop-v1.2.0-x86_64-pc-windows-msvc.tar.gz", sha256 = "a4199f741a441cedd349bf56c5eba01783b1261258b498efeb7ec9945220c3e8", to = "agent-desktop.tar.gz", arch = "amd64" },
]
run = [{ script = "install-windows.ps1" }]
services = [{ name = "driver", command = "venv/Scripts/python.exe -m agentenv_protocol.computer.serve driver.py:AgentDesktop" }]
