type = "computer_driver"
module = "driver.py:MacosHarness"
port = 18765

[install.macos]
python = "requirements-macos.txt"
grants = [{ executable = "venv/bin/python", services = ["accessibility", "post_event", "screen_capture"] }]
services = [{ name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:MacosHarness" }]
