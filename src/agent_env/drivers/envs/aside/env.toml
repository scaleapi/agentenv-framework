type = "computer_driver"
module = "driver.py:AsideDriver"
port = 18765

[install.macos]
python = "requirements-macos.txt"
downloads = [
    { url = "https://releases.aside.com/dev-updater/components/1.26.1111.1046/AsideDaemon/mac-arm64/AsideDaemon-1.26.1111.1046.crx", sha256 = "47f54f506f1b8e7abb75d1ca263bb388e5d4e1bd295c3b52e64b5959082744c6", to = "aside-daemon.crx", arch = "arm64" },
    { url = "https://releases.aside.com/cli/AsideCLI-darwin-arm64-1.26.1111.1046.zip", sha256 = "f4b234e8a63eb2a721a9094b7ded1c286d4f253ede3b4eb347c2d3e0ef04765c", to = "aside-cli.zip", arch = "arm64" },
]
run = [{ script = "install.sh", scope = "session" }]
grants = [
    { executable = "venv/bin/python", services = ["accessibility", "post_event", "screen_capture"] },
    { app = "/opt/agentenv/aside/Aside Computer Use.app", services = ["accessibility", "post_event", "screen_capture"] },
    { app = "/opt/agentenv/aside/home/runtime-computer-use/Aside Computer Use.app", services = ["accessibility", "post_event", "screen_capture"] },
]
services = [
    { name = "daemon", command = "'/opt/agentenv/aside/Aside Daemon.app/Contents/MacOS/aside-daemon'", direct = true, environment = { ASIDE_HOME = "/opt/agentenv/aside/home" } },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:AsideDriver" },
]
