type = "computer_driver"
module = "driver.py:HybridComputerUse"
port = 18765

[install.linux]
python = "requirements.txt"
packages = { apt = ["python3-gi", "gir1.2-atspi-2.0", "gir1.2-gtk-3.0", "gir1.2-gdkpixbuf-2.0", "xdotool", "wmctrl", "x11-utils", "dconf-cli"] }
downloads = [
    { url = "https://github.com/microsoft/Hybrid-Computer-Use/releases/download/v1.0.1/computer-use-1.0.1-linux-amd64.tar.gz", sha256 = "f078cb073b8284e158b91dcc202d47e38acf5f1ecd99245328f9b15f0a48c2fc", to = "computer-use.tar.gz", arch = "amd64" },
]
run = [{ script = "install.sh" }]
services = [{ name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:HybridComputerUse" }]

[install.windows]
python = "requirements-windows.txt"
run = [{ script = "install-windows.ps1" }]
services = [{ name = "driver", command = "venv/Scripts/python.exe -m agentenv_protocol.computer.serve driver.py:HybridComputerUse" }]
