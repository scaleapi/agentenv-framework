type = "computer_driver"
module = "driver.py:PageDriver"
port = 18765

[install.linux]
python = "requirements.txt"
# Node and Playwright MCP, whose browser_* tools the driver serves beside its own, as scripts/upgrade_playwright_mcp.py
# pins them: Node's Linux tarballs (sha256 from nodejs.org's SHASUMS256.txt) and every npm package Playwright MCP needs
# (checked against npm's integrity), which install-playwright-mcp.sh lays out.
downloads = [
    { url = "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.gz", sha256 = "361718c444e49af2ca5a110c83ba6a8901143f23ab285ebbef0341f391f482a9", to = "node.tar.gz", arch = "amd64" },
    { url = "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-arm64.tar.gz", sha256 = "95c264150aceb7f3437a29fd6984924f5f8d1511ea3cbd6c508b83f6c555dae2", to = "node.tar.gz", arch = "arm64" },
    { url = "https://registry.npmjs.org/@playwright/mcp/-/mcp-0.0.84.tgz", sha256 = "4e749bdc5a19138fed51cf0f51e43dca265c1bfc0fc388220fc70756aac60c26", to = "playwright-mcp.tgz" },
    { url = "https://registry.npmjs.org/playwright/-/playwright-1.65.0-alpha-2026-10-30.tgz", sha256 = "0d140b937c384637321d1c90b63794b1f1739b82966b66038077c1493ab9bc2f", to = "playwright.tgz" },
    { url = "https://registry.npmjs.org/playwright-core/-/playwright-core-1.65.0-alpha-2026-10-30.tgz", sha256 = "6f46fa60a6ee52221ebe612a03329f8b233d20158ad37f6b240dd087f4a0f4f9", to = "playwright-core.tgz" },
]
run = [{ script = "install-playwright-mcp.sh" }]
services = [{ name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:PageDriver" }]
