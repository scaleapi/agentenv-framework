<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="32" height="32" href="data:image/png;base64,"/>
  <image class="dark" width="32" height="32" href="data:image/png;base64,"/>
</svg>
