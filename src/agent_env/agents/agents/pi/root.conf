; Root's supervisord (start-agent): the clock follower and the egress proxy, each as its own user, on real
; time, and the A2A server as the agent's user. The server starts with the real-time marker, which agent-env's
; libfaketime takes out of its environment, so the server's own records keep real timestamps. pi, which the bridge
; starts with the marker again (pi_agent.cli_env), stays on real time too, and the model's commands, which pi starts,
; read the env's time. Its socket and logs are root's alone, so the agent's user can
; neither stop nor restart any of them. The follower follows nothing until the server writes its config, which
; sync_env_clock has it do, then picks it up within a quarter second.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/agentenv-root/supervisord.log
pidfile=/run/agentenv-root/supervisord.pid
childlogdir=/var/log/agentenv-root

[unix_http_server]
file=/run/agentenv-root/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv-root/supervisor.sock

[program:clock]
command=/usr/bin/python3 -I /usr/local/lib/agentenv-clock/clock-follower
user=agentenv-clock
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/clock.log
environment=HOME="/nonexistent",USER="agentenv-clock",LOGNAME="agentenv-clock"

[program:egress]
command=/usr/local/lib/agentenv-egress/egress serve
user=agentenv-egress
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/egress.log
environment=HOME="/nonexistent",USER="agentenv-egress",LOGNAME="agentenv-egress",AGENTENV_EGRESS_PRIVATE="allow"

; The server's own interpreter, the venv's, as the image's CMD ran it, not start.sh: the marker holds for the process
; it's given to alone, and a shell that execs the server would hand it an environment without it. It isn't restarted,
; even when it fails to start: what the run gave it (its envs' MCP servers, its config, its peers, the turns it's
; running) lives in its memory, so a server restarted in its place would take turns without them.
[program:agent]
command=/opt/pi-a2a-venv/bin/python3 a2a_server.py
user=agent
directory=/app
priority=10
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/home/agent",USER="agent",LOGNAME="agent",AGENTENV_REAL_TIME="1",AGENTENV_EGRESS_PROXY="http://127.0.0.1:3128",NODE_EXTRA_CA_CERTS="/etc/agentenv/ca.pem",SSL_CERT_FILE="/etc/agentenv/ca-bundle.pem",REQUESTS_CA_BUNDLE="/etc/agentenv/ca-bundle.pem"

; Once the server has exited, or failed to start, root's supervisord stops: it stops the follower and the proxy and
; exits, so the container exits with the server, as it did when the server was its process. Their own exits are left
; to their restarts. The listener speaks supervisord's event listener protocol, and supervisord is its parent.
[eventlistener:agent-exit]
command=/usr/bin/python3 -I -c 'import os, signal, sys
    while True: sys.stdout.write("READY\n"); sys.stdout.flush(); header = dict(f.split(":", 1) for f in sys.stdin.readline().split()); event = dict(f.split(":", 1) for f in sys.stdin.read(int(header["len"])).split()); os.kill(os.getppid(), signal.SIGTERM) if event["processname"] == "agent" else None; sys.stdout.write("RESULT 2\nOK"); sys.stdout.flush()'
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
user=root
directory=/
