; Root's supervisord (start-agent): the clock follower and the egress proxy, each as its own user, on real
; time, and the A2A server as the agent's user. The server starts with the real-time marker, which agent-env's
; libfaketime takes out of its environment, so the server's own records keep real timestamps and everything it starts
; reads the env's time, but the CLI, which it starts with the marker again on an armed clock, so only the model's
; commands follow the clock (gemini_bridge.cli_env). Its socket and logs are root's alone, so the agent's user can
; neither stop nor restart any of them. The follower follows nothing until the server writes its config, which
; sync_env_clock has it do, then picks it up within a quarter second. When the server exits, the container exits with it
; (agent-exit), as it did when the server was the container's process; the follower and the proxy restart in place.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/agentenv-root/supervisord.log
pidfile=/run/agentenv-root/supervisord.pid
childlogdir=/var/log/agentenv-root

[unix_http_server]
file=/run/agentenv-root/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv-root/supervisor.sock

[program:clock]
command=/usr/local/bin/python3 -I /usr/local/lib/agentenv-clock/clock-follower
user=agentenv-clock
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/clock.log
environment=HOME="/nonexistent",USER="agentenv-clock",LOGNAME="agentenv-clock"

[program:egress]
command=/usr/local/lib/agentenv-egress/egress serve
user=agentenv-egress
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/egress.log
environment=HOME="/nonexistent",USER="agentenv-egress",LOGNAME="agentenv-egress",AGENTENV_EGRESS_PRIVATE="allow"

; uvicorn itself, not entrypoint.sh: the marker holds for the process it's given to alone, and a shell that execs
; uvicorn would hand uvicorn an environment without it. It isn't restarted, nor started again when it exits as it starts
; (startretries=0, FATAL at once): a server started in a dead one's place would have none of the run's registrations
; (the env's MCP servers, its config, its peers, its running tasks), and the CLIs of the dead one's turns would go on
; beside it. agent-exit stops the container instead, so the run fails at once.
[program:agent]
command=/usr/local/bin/python3 -m uvicorn a2a_server:app --host 0.0.0.0 --port %(ENV_A2A_PORT)s --timeout-graceful-shutdown 5
user=agent
directory=/workspace
priority=10
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/home/agent",USER="agent",LOGNAME="agent",AGENTENV_REAL_TIME="1",AGENTENV_EGRESS_PROXY="http://127.0.0.1:3128",NODE_EXTRA_CA_CERTS="/etc/agentenv/ca.pem",SSL_CERT_FILE="/etc/agentenv/ca-bundle.pem",REQUESTS_CA_BUNDLE="/etc/agentenv/ca-bundle.pem"

; Stops supervisord, its parent, and so the container, once the A2A server has exited or given up starting (EXITED,
; or FATAL when it exits as it starts); the follower's and the proxy's exits it lets pass, as supervisord restarts them,
; and a normal stop is no exit (the server is STOPPED). supervisord 4.2.5 exits 0 however it's stopped, so the
; container's status doesn't say the server crashed; supervisord's line before it stops, "exited: agent (...; not
; expected)", does. It runs as root, supervisord's user, to signal it, and speaks supervisord's event listener protocol:
; READY, then a header line and the payload of the length it gives, then RESULT 2 OK.
[eventlistener:agent-exit]
command=/usr/local/bin/python3 -I -c 'import os,signal,sys
    def fields(line): return dict(word.split(b":",1) for word in line.split())
    def payload(header): return fields(sys.stdin.buffer.read(int(fields(header)[b"len"])))
    def stop(event): event[b"processname"]==b"agent" and os.kill(os.getppid(),signal.SIGTERM)
    def say(text): sys.stdout.buffer.write(text);sys.stdout.buffer.flush()
    say(b"READY\n")
    for header in sys.stdin.buffer: stop(payload(header));say(b"RESULT 2\nOKREADY\n")'
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
