; Root's supervisord (start-agent): the clock follower and the egress proxy, each as its own user, on real time, and
; the A2A server as the agent's user. The server starts with the real-time marker, which agent-env's libfaketime takes
; out of its environment, so the server's own records keep real timestamps and what it starts reads the env's time; on
; an armed clock it starts Hermes with the marker again, so only the commands Hermes runs do (hermes_bridge.cli_command).
; Its socket and logs are root's alone, so the agent's user can neither stop nor restart any of them. The follower
; follows nothing until the server writes its config, which sync_env_clock has it do, then picks it up within a quarter
; second. The follower and the proxy restart in place; the server doesn't, and its exit stops the container
; ([eventlistener:agent-exit]).
[supervisord]
nodaemon=true
user=root
logfile=/var/log/agentenv-root/supervisord.log
pidfile=/run/agentenv-root/supervisord.pid
childlogdir=/var/log/agentenv-root

[unix_http_server]
file=/run/agentenv-root/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv-root/supervisor.sock

[program:clock]
command=/usr/local/bin/python3 -I /usr/local/lib/agentenv-clock/clock-follower
user=agentenv-clock
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/clock.log
environment=HOME="/nonexistent",USER="agentenv-clock",LOGNAME="agentenv-clock"

[program:egress]
command=/usr/local/lib/agentenv-egress/egress serve
user=agentenv-egress
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/egress.log
environment=HOME="/nonexistent",USER="agentenv-egress",LOGNAME="agentenv-egress",AGENTENV_EGRESS_PRIVATE="allow"

; uvicorn itself, not entrypoint.sh: the marker holds for the process it's given to alone, and a shell that execs
; uvicorn would hand uvicorn an environment without it. HOME is Hermes' install's, /data, as the image sets it; its
; HERMES_ROOT and PYTHONPATH come from the image's environment. It isn't restarted, nor started again when it exits as
; it starts (startretries=0, FATAL at once): a server started in a dead one's place would have none of its turns or
; registrations, and the turns the dead one ran would go on beside it.
[program:agent]
command=/usr/local/bin/python3 -m uvicorn a2a_server:app --host 0.0.0.0 --port %(ENV_A2A_PORT)s --timeout-graceful-shutdown 5
user=agent
directory=/app
priority=10
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/data",USER="agent",LOGNAME="agent",AGENTENV_REAL_TIME="1",AGENTENV_EGRESS_PROXY="http://127.0.0.1:3128",NODE_EXTRA_CA_CERTS="/etc/agentenv/ca.pem",SSL_CERT_FILE="/etc/agentenv/ca-bundle.pem",REQUESTS_CA_BUNDLE="/etc/agentenv/ca-bundle.pem"

; When the A2A server exits for any reason (EXITED, or FATAL when it exits as it starts), this stops supervisord, its
; parent, which stops the follower and the proxy and exits, so the container does, as when the server was the
; container's process, and the run fails at once. The follower's and the proxy's exits are let pass, as supervisord
; restarts them, and a normal stop is no exit (the server is STOPPED). supervisord 4.2.5 exits 0 after any shutdown, so
; the container's status doesn't say the server crashed; supervisord's log line before its exit, "exited: agent (exit
; status N; not expected)", does. It runs as root, supervisord's user, to signal it, and speaks supervisord's
; eventlistener protocol: READY, then a header line and the payload of the length it gives, then RESULT 2 OK.
[eventlistener:agent-exit]
command=/usr/local/bin/python3 -I -c "import os,signal,sys
    def say(text): sys.stdout.write(text);sys.stdout.flush()
    def fields(raw): return dict(word.split(':',1) for word in raw.decode().split())
    def payload(header): return fields(sys.stdin.buffer.read(int(fields(header)['len'])))
    def stop(event): event.get('processname')=='agent' and os.kill(os.getppid(),signal.SIGTERM)
    say('READY\n')
    for header in sys.stdin.buffer: stop(payload(header));say('RESULT 2\nOKREADY\n')"
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
directory=/
priority=1
autorestart=true
