; Root's supervisord, which the base's init starts as root once it has made what the session must not touch: the clock
; follower and the egress proxy, each as its own user, on real time, and the session's supervisord (supervisord.conf)
; as the session user, which runs every session program. Its socket and logs are root's alone, so the session user can
; neither stop nor restart any of them. The session's supervisord logs to the console, as it did when it was the
; computer's first process, so a disk form's console shows each session program start. The follower follows nothing until core writes its config, then picks it up
; within a quarter second. The egress proxy logs a JSON line per connection.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/agentenv-root/supervisord.log
pidfile=/run/agentenv-root/supervisord.pid
childlogdir=/var/log/agentenv-root

[unix_http_server]
file=/run/agentenv-root/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv-root/supervisor.sock

[program:clock]
command=/usr/bin/python3 -I /usr/local/lib/agentenv-clock/clock-follower
user=agentenv-clock
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/clock.log
environment=HOME="/nonexistent",USER="agentenv-clock",LOGNAME="agentenv-clock"

[program:egress]
command=/usr/local/lib/agentenv-egress/egress serve
user=agentenv-egress
directory=/
priority=3
autorestart=true
startsecs=1
startretries=1000
redirect_stderr=true
stdout_logfile=/var/log/agentenv-root/egress.log
environment=HOME="/nonexistent",USER="agentenv-egress",LOGNAME="agentenv-egress"

[program:session]
command=/usr/bin/supervisord -c /etc/supervisor/supervisord.conf
user=user
directory=/home/user
priority=10
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/home/user",USER="user",LOGNAME="user"
