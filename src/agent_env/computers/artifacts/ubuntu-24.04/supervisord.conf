; The session's programs, all run as the session user by this supervisord, which root's (root.conf) runs as that user;
; every one is on the universe's clock, and only agent-env's own servers carry the clock's real-time marker, on their
; own programs (the composer's). A composed driver or app adds its own in conf.d. Every program goes out through the
; egress proxy, on real time, by the variables below (Java and Node's fetch by their own, which ignore the others),
; and trusts its CA through the trust files agentenv adds, which root owns.
[supervisord]
nodaemon=true
logfile=/var/log/agentenv/supervisord.log
pidfile=/run/agentenv/supervisord.pid
childlogdir=/var/log/agentenv
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/run/agentenv/bus",
    HTTP_PROXY="http://127.0.0.1:3128",HTTPS_PROXY="http://127.0.0.1:3128",ALL_PROXY="http://127.0.0.1:3128",NO_PROXY="localhost,127.0.0.1,::1,host.docker.internal",
    http_proxy="http://127.0.0.1:3128",https_proxy="http://127.0.0.1:3128",all_proxy="http://127.0.0.1:3128",no_proxy="localhost,127.0.0.1,::1,host.docker.internal",
    SSL_CERT_FILE="/etc/agentenv/ca-bundle.pem",REQUESTS_CA_BUNDLE="/etc/agentenv/ca-bundle.pem",NODE_EXTRA_CA_CERTS="/etc/agentenv/ca.pem",
    NODE_USE_ENV_PROXY="1",JAVA_TOOL_OPTIONS="-Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1|::1|host.docker.internal"

[unix_http_server]
file=/run/agentenv/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv/supervisor.sock

[program:xvfb]
command=/usr/local/bin/start-desktop xvfb
priority=10
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/var/log/agentenv/xvfb.log

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/run/agentenv/bus
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/agentenv/dbus.log

; The session exits whenever X does, often within its first seconds, so it counts as started at once and X dying
; however often never leaves it FATAL; with-x waits for X before each start.
[program:desktop]
command=/usr/local/bin/start-desktop with-x xfce4-session
priority=20
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/agentenv/desktop.log

[include]
files = /etc/supervisor/conf.d/*.conf
