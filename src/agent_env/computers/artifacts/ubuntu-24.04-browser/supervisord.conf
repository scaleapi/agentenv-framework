; The session's programs, all run as the session user by this supervisord, which root's (root.conf) runs as that user:
; the website browser's X server and the site proxy. Every program is on the universe's clock but the site proxy, which
; carries the clock's real-time marker, as agent-env's own servers do on their own programs (the composer's), so its
; network log keeps real time. A composed driver or app adds its own in conf.d.
[supervisord]
nodaemon=true
logfile=/var/log/agentenv/supervisord.log
pidfile=/run/agentenv/supervisord.pid
childlogdir=/var/log/agentenv

[unix_http_server]
file=/run/agentenv/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv/supervisor.sock

; The browser's own X server, at a common desktop size: the page's own size is the browser's window setting, which it
; holds the page to whatever the screen.
[program:xvfb]
command=/usr/local/bin/start-computer xvfb
priority=5
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/var/log/agentenv/xvfb.log

[program:site-proxy]
command=/usr/bin/python3 /usr/local/bin/agentenv-site-proxy
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/agentenv/site-proxy.log
environment=AGENTENV_REAL_TIME="1"

[include]
files = /etc/supervisor/conf.d/*.conf
