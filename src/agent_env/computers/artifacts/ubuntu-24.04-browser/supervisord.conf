; The base computer's own programs, the website browser's X server and the site proxy, run as the session user. A
; composed driver or app adds its own in conf.d.
[supervisord]
nodaemon=true
logfile=/var/log/agentenv/supervisord.log
pidfile=/run/agentenv/supervisord.pid
childlogdir=/var/log/agentenv

[unix_http_server]
file=/run/agentenv/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv/supervisor.sock

; The browser's own X server, at a common desktop size: the page's own size is the browser's window setting, which it
; holds the page to whatever the screen. supervisord runs one X at a time, so a lock is one a killed X left, which X
; refuses to start over while the pid it names is taken.
[program:xvfb]
command=/bin/sh -c 'rm -f /tmp/.X99-lock; exec Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac'
priority=5
autorestart=true
startsecs=1
redirect_stderr=true
stdout_logfile=/var/log/agentenv/xvfb.log

[program:site-proxy]
command=/usr/bin/python3 /usr/local/bin/agentenv-site-proxy
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/agentenv/site-proxy.log

[include]
files = /etc/supervisor/conf.d/*.conf
