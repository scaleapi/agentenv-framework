; The base computer's own program, the site proxy, run as the session user. A composed driver or app adds its own in
; conf.d.
[supervisord]
nodaemon=true
logfile=/var/log/agentenv/supervisord.log
pidfile=/run/agentenv/supervisord.pid
childlogdir=/var/log/agentenv

[unix_http_server]
file=/run/agentenv/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentenv/supervisor.sock

[program:site-proxy]
command=/usr/bin/python3 /usr/local/bin/agentenv-site-proxy
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/agentenv/site-proxy.log

[include]
files = /etc/supervisor/conf.d/*.conf
