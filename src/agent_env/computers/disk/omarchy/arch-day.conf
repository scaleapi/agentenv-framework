# pacman's configuration for the recipe's one transaction from the Arch Linux Archive: the day of Hyprland 0.56.2-1 and
# GCC 16.1.1 20260728, which trycua's Hyprland plugin kit pins, as a day snapshot, its packages signature-checked by
# pacman. Omarchy's own pacman.conf stays as it is.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
DownloadUser = alpm
ParallelDownloads = 5

[core]
Server = https://archive.archlinux.org/repos/2026/08/08/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/08/08/$repo/os/$arch
