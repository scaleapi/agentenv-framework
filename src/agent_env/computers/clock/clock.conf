# Read once by agent-env's libfaketime as each process loads it (the environment can override a setting). Only the
# session user's processes are faked; the clock comes from the page the follower writes, never from a cache.
AGENTENV_SESSION_UID=1000
FAKETIME_TIMESTAMP_FILE=/run/agentenv-clock/clock
FAKETIME_NO_CACHE=1
FAKETIME_DONT_FAKE_MONOTONIC=1
FAKETIME_FMT=%s
FAKETIME_DISABLE_SHM=1
AGENTENV_CLOCK_PAGE=/dev/shm/agentenv-clock
AGENTENV_CLOCK_PAGE_UID=0
